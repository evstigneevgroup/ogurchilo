# Netlify: статика без сборки
[build]
  publish = "."

# демо-режим: правки должны доходить мгновенно, без часового кэша
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
